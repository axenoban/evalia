name: EVALIA | Registro de pedidos UI candidato

on:
  push:
    branches:
      - feature/evalia-registro-compacto

permissions:
  contents: read

jobs:
  node-tests:
    name: Tests de dominio y registro
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check

  next-build:
    name: Compilar Next.js 16
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
