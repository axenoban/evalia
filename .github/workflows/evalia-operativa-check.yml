name: EVALIA · Aplicación operativa

on:
  push:
    branches: [feature/evalia-panel-operativo]
  pull_request:
    branches: [feature/skills-formularios-evalia]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  domain:
    name: Dominio y skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
  next-build:
    name: Compilar Next.js 16
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
