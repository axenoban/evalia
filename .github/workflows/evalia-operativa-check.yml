name: EVALIA · Aplicación operativa

on:
  push:
    branches: [feature/evalia-panel-operativo, feature/evalia-captura-docenas-colores, feature/evalia-ciclo-cobros-entregas, feature/evalia-vercel-preview, feature/evalia-release-candidate, feature/evalia-solo-pedidos, feature/evalia-ux-cierre-y-whatsapp, feature/evalia-selector-cobro-express, feature/evalia-envios-impresion]
  pull_request:
    branches: [feature/skills-formularios-evalia, feature/evalia-panel-operativo, feature/evalia-captura-docenas-colores]
  workflow_dispatch:

# El proveedor de runners comparte puertos de Docker entre ejecuciones simultáneas.
# Serializar el workflow evita choques de Supabase local (puerto 54324).
concurrency:
  group: evalia-operativa-supabase-local
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  domain:
    name: Dominio y skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
  next-build:
    name: Compilar Next.js 16
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build

  database:
    name: Migraciones Supabase y pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Arrancar instancia local y aplicar migraciones
        run: supabase start
      - name: Ejecutar pruebas pgTAP en PostgreSQL
        run: supabase test db
      - name: Apagar entorno local
        if: always()
        run: supabase stop --no-backup || true
