name: EVALIA | Dashboard UI candidato

on:
  push:
    branches:
      - feature/evalia-dashboard-catalogo-responsive
  pull_request:
    branches:
      - dev/evalia-core

permissions:
  contents: read

jobs:
  ui-tests:
    name: Tests de dominio y dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
  next-build:
    name: Compilar Next.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
