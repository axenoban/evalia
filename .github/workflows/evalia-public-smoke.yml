name: EVALIA | Prueba pública sin cuenta Vercel
on:
  push:
    branches:
      - feature/evalia-release-candidate
      - feature/evalia-solo-pedidos
      - feature/evalia-ux-cierre-y-whatsapp
      - feature/evalia-selector-cobro-express
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anonymous-browser:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar accesibilidad sin cookies ni credenciales
        shell: bash
        env:
          BASE_RELEASE: https://evalia-git-feature-evalia-release-candidate-galaxian131-9858.vercel.app
          BASE_ORDERS: https://evalia-git-feature-evalia-solo-pedidos-galaxian131-9858.vercel.app
          BASE_UX: https://evalia-git-feature-evalia-ux-cierre-y-whatsapp-galaxian131-9858.vercel.app
          BASE_EXPRESS: https://evalia-git-feature-evalia-selector-cobr-bf9af7-galaxian131-9858.vercel.app
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" = "feature/evalia-selector-cobro-express" ]; then
            BASE="$BASE_EXPRESS"
          elif [ "$GITHUB_REF_NAME" = "feature/evalia-ux-cierre-y-whatsapp" ]; then
            BASE="$BASE_UX"
          elif [ "$GITHUB_REF_NAME" = "feature/evalia-solo-pedidos" ]; then
            BASE="$BASE_ORDERS"
          else
            BASE="$BASE_RELEASE"
          fi
          BODY="$(mktemp)"
          trap 'rm -f "$BODY"' EXIT

          STATUS="$(curl --silent --show-error --location --output "$BODY" --write-out '%{http_code}' "$BASE/")"
          echo "Panel anónimo: HTTP $STATUS"
          test "$STATUS" = "200"
          grep -q 'EVALIA' "$BODY"
          if grep -qi 'Authentication Required.*Vercel' "$BODY"; then
            echo "::error::La página pública está bloqueada por Vercel Authentication"
            exit 1
          fi

          STATUS="$(curl --silent --show-error --output "$BODY" --write-out '%{http_code}' "$BASE/api/portal-estado")"
          echo "Backend: HTTP $STATUS"
          test "$STATUS" = "200"
          grep -q '"ready":true' "$BODY"

          STATUS="$(curl --silent --show-error --output "$BODY" --write-out '%{http_code}' "$BASE/p/no-es-un-token")"
          echo "Token inválido: HTTP $STATUS"
          test "$STATUS" = "404"

          STATUS="$(curl --silent --show-error --output "$BODY" --write-out '%{http_code}' "$BASE/api/cliente-qr")"
          echo "QR sin sesión: HTTP $STATUS"
          test "$STATUS" = "404"
