name: EVALIA | Regresión integral V1 consolidada
on:
  push:
    branches:
      - feature/evalia-v1-consolidada
  pull_request:
    branches: [dev/evalia-core, main]
permissions:
  contents: read
concurrency:
  group: evalia-v1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm run check
  next:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      # E1-09: capture the resolved dependency graph for review and versioning.
      # Use npm ci as soon as the reviewed lockfile is present.
      - name: Install web dependencies
        run: |
          if test -f package-lock.json; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Preserve resolved lockfile for E1 review
        uses: actions/upload-artifact@v4
        with:
          name: evalia-web-package-lock
          path: web/package-lock.json
          if-no-files-found: error
          retention-days: 7
      - run: npm run build
      - name: Audit production dependencies (E1-08)
        run: npm audit --omit=dev --audit-level=high
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: '3.4.0'
      - name: Isolate Supabase CI stack and ports
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import socket
          path = pathlib.Path("supabase/config.toml")
          config = path.read_text()
          project = "evalia-ci-" + os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"]
          assert 'project_id = "evalia"' in config
          config = config.replace('project_id = "evalia"', f'project_id = "{project}"', 1)
          keys = [("api", "port"), ("db", "port"), ("db", "shadow_port"),
                  ("studio", "port"), ("local_smtp", "port"),
                  ("local_smtp", "smtp_port"), ("local_smtp", "pop3_port"),
                  ("analytics", "port"), ("analytics", "vector_port"), ("db.pooler", "port")]
          sockets = []
          sections = {}
          try:
              for section, key in keys:
                  s = socket.socket()
                  sockets.append(s)
                  s.bind(("0.0.0.0", 0))
                  sections.setdefault(section, []).append(f"{key} = {s.getsockname()[1]}")
              for section, values in sections.items():
                  assert f"[{section}]" not in config, f"Existing config section: {section}"
                  config += "\n[" + section + "]\n" + "\n".join(values) + "\n"
              path.write_text(config)
          finally:
              for s in sockets:
                  s.close()
          PY
      # Candidato E1: generar versión con CLI real y probar todas las migraciones.
      - name: Generate E1 session policy migration in isolated CI
        shell: bash
        run: |
          set -euo pipefail
          supabase migration new e1_session_policy
          migration="$(find supabase/migrations -maxdepth 1 -name '*_e1_session_policy.sql')"
          test -f "$migration"
          cat ops/security/e1-session-policy.sql ops/security/e1-customer-create.sql > "$migration"
          echo "E1 session migration candidate: $migration"
      - run: supabase start
      - run: supabase test db
      - if: always()
        run: supabase stop --no-backup || true
