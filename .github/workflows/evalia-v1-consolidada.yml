name: EVALIA | Regresión integral V1 consolidada
on:
  push:
    branches:
      - feature/evalia-v1-consolidada
  pull_request:
    branches: [dev/evalia-core, main]
permissions:
  contents: read
concurrency:
  group: evalia-v1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm run check
  next:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: npm run build
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      # Candidato E1: generar versión con CLI real y probar todas las migraciones.
      - name: Generate E1 session policy migration in isolated CI
        shell: bash
        run: |
          set -euo pipefail
          supabase migration new e1_session_policy
          migration="$(find supabase/migrations -maxdepth 1 -name '*_e1_session_policy.sql')"
          test -f "$migration"
          cp ops/security/e1-session-policy.sql "$migration"
          echo "E1 session migration candidate: $migration"
      - run: supabase start
      - run: supabase test db
      - if: always()
        run: supabase stop --no-backup || true
