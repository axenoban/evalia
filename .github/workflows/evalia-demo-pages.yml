name: EVALIA demo · GitHub Pages

on:
  push:
    branches:
      - feature/fundamentos-reservas-pedidos
    paths:
      - 'site/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/evalia-demo-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: evalia-demo-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests de simulación y sintaxis
        run: npm run check
      - name: Comprobar archivos estáticos
        run: |
          test -f site/index.html
          test -f site/styles.css
          test -f site/app.js
          test -f site/domain.js
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
