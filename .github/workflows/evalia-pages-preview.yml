name: EVALIA | Publicar panel de prueba en GitHub Pages

on:
  push:
    branches:
      - feature/evalia-publicacion-pages
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: evalia-published-pages
  cancel-in-progress: true

jobs:
  build:
    name: Compilar sitio estático de prueba
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar exportación sin backend Node
        working-directory: web
        run: node scripts/prepare-pages.mjs
      - name: Instalar dependencias
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Exportar Next.js
        working-directory: web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://vbedfbijoqcqpzjzawrh.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_NQLPu8gWqTyuAoEhIR-TUg_cQSKT2M8
          NEXT_PUBLIC_EVALIA_STATIC_PREVIEW: '1'
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
      - name: Revisar el artefacto HTML
        run: |
          test -s web/out/index.html
          test -d web/out/_next
          test -f web/out/.nojekyll
          if grep -rlE 'SUPABASE_SECRET_KEY|sb_secret_|SUPABASE_SERVICE_ROLE_KEY' web/out --include='*.html' --include='*.js' | grep -q .; then
            echo "::error::Referencia a clave privada en el artefacto"
            exit 1
          fi
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Subir archivos públicos
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    name: Publicar en Pages
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: publish
        uses: actions/deploy-pages@v4
