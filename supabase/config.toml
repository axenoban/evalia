project_id = "evalia"

# Configuración de Auth para entornos locales de prueba. El proyecto remoto requiere la misma política en Dashboard.
[auth]
enable_signup = false
minimum_password_length = 8
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/cuenta"]

# Frecuencia reducida exclusivamente en stack local aislado para regresión Auth.
[auth.email]
max_frequency = "1s"

# E1: explicitly enable TOTP for real SDK regression.
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
